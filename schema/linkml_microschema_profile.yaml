name: linkml-microschema-profile
description: 'A LinkML schema defining the Microschema Profile for composable data
  elements.

  Microschemas are designed for inline composition without identifiers.

  Domain-specific record and example microschemas live in downstream schemas

  (e.g., https://w3id.org/linkml/clinical-microschemas).'
title: LinkML Microschema Profile
see_also:
- https://linkml.github.io/linkml-microschema-profile
id: https://w3id.org/linkml/linkml-microschema-profile
version: 0.3.0
imports:
- linkml:types
license: MIT
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
default_prefix: https://w3id.org/linkml/linkml-microschema-profile/
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ComparatorEnum:
    name: ComparatorEnum
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/ComparatorEnum
    description: Comparator for quantity values
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    permissible_values:
      lt:
        text: lt
        description: Less than
      le:
        text: le
        description: Less than or equal to
      ge:
        text: ge
        description: Greater than or equal to
      gt:
        text: gt
        description: Greater than
slots:
  profile_version:
    name: profile_version
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/profile_version
    description: Version of microschema profile this conforms to
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/profile_version
    owner: MicroschemaDefinition
    domain_of:
    - MicroschemaDefinition
    range: string
  domain_of_use:
    name: domain_of_use
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/domain_of_use
    description: Domains where this microschema is applicable
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/domain_of_use
    owner: MicroschemaDefinition
    domain_of:
    - MicroschemaDefinition
    range: string
    multivalued: true
  subject:
    name: subject
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/subject
    description: Entity being measured, observed, or interviewed - person, animal,
      specimen, or environmental material
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/subject
    owner: MicroschemaDefinition
    domain_of:
    - MicroschemaDefinition
    range: string
    required: true
  observation_type:
    name: observation_type
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/observation_type
    description: Question being asked, measurement being taken, quality being observed
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/observation_type
    owner: MicroschemaDefinition
    domain_of:
    - MicroschemaDefinition
    range: string
    required: true
  location:
    name: location
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/location
    description: Spatial metadata specifying where the observation was made - geolocation,
      place name, site id, environment, or biome
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/location
    owner: MicroschemaDefinition
    domain_of:
    - MicroschemaDefinition
    range: string
    required: true
  temporality:
    name: temporality
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/temporality
    description: Temporal metadata specifying when an observation was made. This can
      be relative or absolute - datetime, age of person, season, or geologic era
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/temporality
    owner: MicroschemaDefinition
    domain_of:
    - MicroschemaDefinition
    range: string
    required: true
  methodology:
    name: methodology
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/methodology
    description: Information about how an observation was made - method, instrument,
      reagent kit, statistical modifier
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/methodology
    owner: MicroschemaDefinition
    domain_of:
    - MicroschemaDefinition
    range: string
    required: true
  observation_result:
    name: observation_result
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/observation_result
    description: The outcome of the observation type - answer, value, result, determination
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/observation_result
    owner: MicroschemaDefinition
    domain_of:
    - MicroschemaDefinition
    range: ValueMicroschemaDefinition
    required: true
    inlined: true
    inlined_as_list: true
  quantity_value:
    name: quantity_value
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/quantity_value
    description: The numeric value
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/quantity_value
    owner: Quantity
    domain_of:
    - Quantity
    range: decimal
    required: true
  quantity_unit:
    name: quantity_unit
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/quantity_unit
    description: Unit (UCUM, UO, QUDT, etc.)
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    mappings:
    - schema:unitCode
    slot_uri: schema:unitCode
    owner: Quantity
    domain_of:
    - Quantity
    range: uriorcurie
    required: true
  comparator:
    name: comparator
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/comparator
    description: Comparison operator (less than, greater than, etc.) or exact if null
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/comparator
    owner: Quantity
    domain_of:
    - Quantity
    range: ComparatorEnum
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/datetime
    description: Absolute timestamp
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/datetime
    owner: Timepoint
    domain_of:
    - Timepoint
    range: datetime
  relative_to_event:
    name: relative_to_event
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/relative_to_event
    description: Event this is relative to
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/relative_to_event
    owner: Timepoint
    domain_of:
    - Timepoint
    range: uriorcurie
  offset:
    name: offset
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/offset
    description: Offset from event (e.g., "+3 days")
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/offset
    owner: Timepoint
    domain_of:
    - Timepoint
    range: Quantity
    inlined: true
    inlined_as_list: true
  subject_age:
    name: subject_age
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/subject_age
    description: Age of the subject at this timepoint (e.g., age when the event occurred)
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/subject_age
    owner: Timepoint
    domain_of:
    - Timepoint
    range: Quantity
    inlined: true
    inlined_as_list: true
  interval_start:
    name: interval_start
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/interval_start
    description: Start of the interval
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/interval_start
    owner: TimeInterval
    domain_of:
    - TimeInterval
    range: Timepoint
    inlined: true
    inlined_as_list: true
  interval_end:
    name: interval_end
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/interval_end
    description: End of the interval
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/interval_end
    owner: TimeInterval
    domain_of:
    - TimeInterval
    range: Timepoint
    inlined: true
    inlined_as_list: true
  duration:
    name: duration
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/duration
    description: Duration as alternative to start/end
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/duration
    owner: TimeInterval
    domain_of:
    - TimeInterval
    range: Quantity
    inlined: true
    inlined_as_list: true
  code:
    name: code
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/code
    description: The code value as a CURIE
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/code
    owner: CodedValue
    domain_of:
    - CodedValue
    range: uriorcurie
    required: true
  code_label:
    name: code_label
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/code_label
    description: Human-readable label for the code
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/code_label
    owner: CodedValue
    domain_of:
    - CodedValue
    range: string
  code_system:
    name: code_system
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/code_system
    description: The code system URI
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slot_uri: https://w3id.org/linkml/linkml-microschema-profile/code_system
    owner: CodedValue
    domain_of:
    - CodedValue
    range: uriorcurie
classes:
  MicroschemaDefinition:
    name: MicroschemaDefinition
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/MicroschemaDefinition
    annotations:
      must_not_have_id_slot:
        tag: must_not_have_id_slot
        value: true
      must_be_inlined:
        tag: must_be_inlined
        value: true
    description: A metaclass for classes that conform to the Microschema profile.
      Classes that instantiate this are designed for inline composition.
    comments:
    - Classes instantiating this SHOULD NOT have identifier slots
    - Classes instantiating this SHOULD be used with inlined=true
    - Classes instantiating this MAY compose other microschemas via attributes
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    abstract: true
    slots:
    - profile_version
    - domain_of_use
    - subject
    - observation_type
    - location
    - temporality
    - methodology
    - observation_result
    class_uri: https://w3id.org/linkml/linkml-microschema-profile/MicroschemaDefinition
  ValueMicroschemaDefinition:
    name: ValueMicroschemaDefinition
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/ValueMicroschemaDefinition
    annotations:
      must_not_have_id_slot:
        tag: must_not_have_id_slot
        value: true
      must_be_inlined:
        tag: must_be_inlined
        value: true
    description: 'A microschema representing a typed value with optional unit/system.
      Examples: Quantity, Timepoint, CodedValue, Range. This is the range for observation
      result'
    comments:
    - Classes instantiating this SHOULD NOT have identifier slots
    - Classes instantiating this SHOULD be used with inlined=true
    - Classes instantiating this MAY compose other microschemas via attributes
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    abstract: true
    class_uri: https://w3id.org/linkml/linkml-microschema-profile/ValueMicroschemaDefinition
  Quantity:
    name: Quantity
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/Quantity
    instantiates:
    - ValueMicroschemaDefinition
    description: A numerical value with unit
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slots:
    - quantity_value
    - quantity_unit
    - comparator
    class_uri: https://w3id.org/linkml/linkml-microschema-profile/Quantity
  Timepoint:
    name: Timepoint
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/Timepoint
    instantiates:
    - ValueMicroschemaDefinition
    description: A point in time, potentially relative
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slots:
    - datetime
    - relative_to_event
    - offset
    - subject_age
    class_uri: https://w3id.org/linkml/linkml-microschema-profile/Timepoint
  TimeInterval:
    name: TimeInterval
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/TimeInterval
    instantiates:
    - ValueMicroschemaDefinition
    description: A period between two timepoints
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slots:
    - interval_start
    - interval_end
    - duration
    class_uri: https://w3id.org/linkml/linkml-microschema-profile/TimeInterval
  CodedValue:
    name: CodedValue
    definition_uri: https://w3id.org/linkml/linkml-microschema-profile/CodedValue
    instantiates:
    - ValueMicroschemaDefinition
    description: A value from a controlled vocabulary
    from_schema: https://w3id.org/linkml/linkml-microschema-profile
    slots:
    - code
    - code_label
    - code_system
    class_uri: https://w3id.org/linkml/linkml-microschema-profile/CodedValue
